<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Muslim Match</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #183b2b;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #0f5132;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0f5132;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create Your Account</h1>

    <p class="intro">
      Join Muslim Match and start looking for your match.
    </p>

    <form id="registerForm">

      <label for="name">First Name</label>
      <input type="text" id="name" required>

      <label for="age">Age</label>
      <input type="number" id="age" min="18" required>

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="country">Country</label>
      <input type="text" id="country" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit">Create Account</button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">← Back to Muslim Match</a>

  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_API_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const client = window.supabase.createClient(
      SUPABASE_URL,https://erlerglteulmpgyckucy.supabase.co;
      SUPABASE_PUBLISHABLE_KEYsb_publishable_o7kZ5jCIe_QAPLYYIANUUw_ZQ6gS2_j;
    );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      message.textContent = "Creating your account...";

      const firstName = document.getElementById("name").value;
      const age = Number(document.getElementById("age").value);
      const gender = document.getElementById("gender").value;
      const country = document.getElementById("country").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { data, error } = await client.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (!data.user) {
        message.textContent = "Account could not be created.";
        return;
      }

      if (!data.session) {
        message.textContent =
          "Account created. Please check your email to confirm your account.";
        return;
      }

      const { error: profileError } = await client
        .from("profiles")
        .insert({
          user_id: data.user.id,
          first_name: firstName,
          age: age,
          gender: gender,
          country: country
        });

      if (profileError) {
        message.textContent = profileError.message;
        return;
      }

      message.textContent =
        "Account created successfully! Welcome to Muslim Match.";
    });
  </script>

</body>
</html>
