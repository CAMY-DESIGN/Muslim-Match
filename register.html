<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Muslim Match - Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      color: #176b45;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #176b45;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #125537;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #176b45;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Muslim Match</h1>

    <p class="subtitle">Create your account</p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        minlength="6"
        required
      >

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        placeholder="Enter your age"
        min="18"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

      <div id="message"></div>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script>

    /* SUPABASE CONNECTION */

    const SUPABASE_URL =
      "https://erlerglteulmpgyckucy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_o7kZ5jCIe_QAPLYYIANUUw_ZQ6gS2_j";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* REGISTRATION */

    const form = document.getElementById("registerForm");

    const button = document.getElementById("registerButton");

    const message = document.getElementById("message");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      message.textContent = "";

      button.disabled = true;

      button.textContent = "Creating account...";


      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const gender =
        document.getElementById("gender").value;

      const age =
        document.getElementById("age").value;


      if (Number(age) < 18) {

        message.textContent =
          "You must be 18 or older to register.";

        button.disabled = false;

        button.textContent = "Create Account";

        return;
      }


      try {

        const { data, error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name,
                gender: gender,
                age: Number(age)
              }

            }

          });


        if (error) {

          message.textContent =
            error.message;

          button.disabled = false;

          button.textContent = "Create Account";

          return;
        }


        message.textContent =
          "Account created successfully!";


        form.reset();


        button.disabled = false;

        button.textContent = "Create Account";


      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

        button.disabled = false;

        button.textContent = "Create Account";

      }

    });

  </script>

</body>
</html>
